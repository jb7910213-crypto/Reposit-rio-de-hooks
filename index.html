<style>
:root{
  --bg:#0A0D13; --surface:#10141D; --raised:#151B27; --border:#1E2634; --border-hi:#2A3547;
  --text:#E9EDF5; --muted:#8A93A8; --dim:#5C667C;
  --scroll:#5B9BFF; --clique:#34D399; --lead:#F5A83C; --venda:#F76E8B;
  --slot:#9DBDFF; --slot-bg:#16233C; --slot-border:#243B63;
  --font-body:'Inter',system-ui,sans-serif; --font-display:'Unbounded',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:#2A4A85;color:#fff}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(10,13,19,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
header::before{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--scroll),var(--clique) 33%,var(--lead) 66%,var(--venda))}
.hwrap{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text);flex-shrink:0}
.logo .bolt{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1B3A6B,#0F1B33);border:1px solid var(--slot-border);display:grid;place-items:center;font-size:17px}
.logo .name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em}
.logo .name b{color:var(--scroll);font-weight:700}
.logo .tag{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--dim);letter-spacing:.14em;margin-top:2px}
.search{flex:1;position:relative;max-width:560px;margin-left:auto}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim)}
.search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 84px 10px 38px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--scroll)}
.search input::placeholder{color:var(--dim)}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:2px 7px;background:var(--bg)}

/* ---------- filtros ---------- */
.filters{max-width:1240px;margin:0 auto;padding:18px 24px 6px}
.fgroup{margin-bottom:12px}
.flabel{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6.5px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .13s;font-family:var(--font-body);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .13s}
.chip[data-on]{color:var(--text);border-color:var(--border-hi);background:var(--raised)}
.chip[data-obj="scroll"][data-on]{border-color:var(--scroll)} .chip[data-obj="scroll"] .dot{background:var(--scroll)}
.chip[data-obj="clique"][data-on]{border-color:var(--clique)} .chip[data-obj="clique"] .dot{background:var(--clique)}
.chip[data-obj="lead"][data-on]{border-color:var(--lead)} .chip[data-obj="lead"] .dot{background:var(--lead)}
.chip[data-obj="venda"][data-on]{border-color:var(--venda)} .chip[data-obj="venda"] .dot{background:var(--venda)}
.chip[data-fam][data-on]{border-color:var(--slot);}
.chip .n{font-family:var(--font-mono);font-size:10.5px;color:var(--dim)}

/* ---------- barra de status ---------- */
.statusbar{max-width:1240px;margin:0 auto;padding:10px 24px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.count{font-family:var(--font-display);font-weight:700;font-size:15px}
.count small{font-family:var(--font-body);font-weight:500;font-size:12.5px;color:var(--muted);margin-left:6px}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;gap:7px;transition:all .13s}
.btn:hover{color:var(--text);border-color:var(--border-hi)}
.btn[data-on]{color:var(--lead);border-color:var(--lead)}
.btn.clear{display:none}
.btn.clear.show{display:inline-flex}

/* ---------- grid ---------- */
.grid{max-width:1240px;margin:0 auto;padding:4px 24px 80px;column-count:3;column-gap:16px}
@media(max-width:980px){.grid{column-count:2}}
@media(max-width:640px){.grid{column-count:1}.hwrap{flex-wrap:wrap}.search{order:3;max-width:none;flex-basis:100%}}
.card{break-inside:avoid;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px 12px;margin-bottom:16px;transition:border-color .15s, transform .15s;position:relative}
.card:hover{border-color:var(--border-hi)}
.card.hit{border-color:var(--scroll);animation:pulse 1.6s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,155,255,0)}50%{box-shadow:0 0 0 5px rgba(91,155,255,.18)}}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.num{font-family:var(--font-mono);font-size:11px;color:var(--dim);letter-spacing:.05em}
.badge{font-size:10.5px;font-weight:600;border-radius:999px;padding:3.5px 10px;letter-spacing:.02em}
.badge.scroll{color:var(--scroll);background:rgba(91,155,255,.12)}
.badge.clique{color:var(--clique);background:rgba(52,211,153,.12)}
.badge.lead{color:var(--lead);background:rgba(245,168,60,.13)}
.badge.venda{color:var(--venda);background:rgba(247,110,139,.13)}
.htext{font-size:15px;line-height:1.62;font-weight:500;letter-spacing:.001em}
.slot{font-family:var(--font-mono);font-size:.84em;color:var(--slot);background:var(--slot-bg);border:1px solid var(--slot-border);border-radius:6px;padding:1px 6px;white-space:nowrap}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--border)}
.gat{font-size:11.5px;color:var(--muted);flex:1;line-height:1.4}
.icon{background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);cursor:pointer;padding:6px;display:grid;place-items:center;transition:all .13s}
.icon:hover{color:var(--text);background:var(--raised)}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon.saved{color:var(--lead)}
.icon.saved svg{fill:var(--lead);stroke:var(--lead)}
.icon.copied{color:var(--clique)}

.card.gold{border-color:#4A3D1E}
.card.gold:hover{border-color:#7A6430}
.card.gold .num{color:#E8C46B}
#btnGold[data-on]{color:#E8C46B;border-color:#E8C46B}
.card.own{border-color:#3D3266}
.card.own:hover{border-color:#5A4A96}
.card.own .num{color:#B9A7F5}
#btnOwn[data-on]{color:#B9A7F5;border-color:#B9A7F5}

/* ---------- empty ---------- */
.empty{display:none;max-width:1240px;margin:0 auto;padding:70px 24px;text-align:center;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-family:var(--font-display);font-size:19px;color:var(--text);margin-bottom:8px}
.empty button{margin-top:16px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);background:var(--raised);border:1px solid var(--clique);color:var(--text);border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;opacity:0;transition:all .25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--border);padding:26px 24px;text-align:center;color:var(--dim);font-size:12px;font-family:var(--font-mono)}
</style>
</head>

/* ---------- estado ---------- */
const state = { q:"", objs:new Set(), fams:new Set(), savedOnly:false, ownOnly:false, goldOnly:false, saved:new Set() };
try{ const s = localStorage.getItem("hooklab_saved"); if(s) state.saved = new Set(JSON.parse(s)); }catch(e){}

const $ = s => document.querySelector(s);
const grid = $("#grid"), toast = $("#toast");

const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
DATA.forEach(h => h._idx = norm(h.t + " " + h.g) + " " + (h.p===1 ? "p-" + String(h.pn).padStart(3,"0") + " proprio proprios " : h.p===2 ? "g-" + String(h.pn).padStart(3,"0") + " ouro gold padrao " : "") + "#" + String(h.n).padStart(3,"0") + " " + h.n);

/* ---------- render ---------- */
const OBJL = {scroll:"Parar o scroll", clique:"Gerar clique", lead:"Aquecer o lead", venda:"Fechar a venda"};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const slotify = t => esc(t).replace(/\[([^\]]+)\]/g, '<span class="slot">[$1]</span>');

function cardHTML(h){
  const saved = state.saved.has(h.n) ? " saved" : "";
  return `<article class="card${h.p===1 ? " own" : h.p===2 ? " gold" : ""}" id="h${h.n}" data-n="${h.n}">
    <div class="chead">
      <span class="num">${h.p===1 ? "P-" + String(h.pn).padStart(3,"0") + " · PRÓPRIO" : h.p===2 ? "G-" + String(h.pn).padStart(3,"0") + " · OURO" : "#" + String(h.n).padStart(3,"0")}</span>
      <span class="badge ${h.o}">${OBJL[h.o]}</span>
    </div>
    <p class="htext">${slotify(h.t)}</p>
    <div class="cfoot">
      <span class="gat">${esc(h.g)}</span>
      <button class="icon act-copy" title="Copiar hook" aria-label="Copiar hook">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button class="icon act-save${saved}" title="Salvar hook" aria-label="Salvar hook">
        <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8Z"/></svg>
      </button>
    </div>
  </article>`;
}

function filtered(){
  return DATA.filter(h =>
    (!state.savedOnly || state.saved.has(h.n)) &&
    ((!state.ownOnly && !state.goldOnly) || (state.ownOnly && h.p===1) || (state.goldOnly && h.p===2)) &&
    (state.objs.size === 0 || state.objs.has(h.o)) &&
    (state.fams.size === 0 || h.f.some(f => state.fams.has(f))) &&
    (state.q === "" || h._idx.includes(state.q))
  );
}

function render(){
  const list = filtered();
  grid.innerHTML = list.map(cardHTML).join("");
  $("#count").textContent = list.length;
  $("#countLabel").textContent = list.length === DATA.length ? "hooks" : `de ${DATA.length} hooks`;
  $("#empty").classList.toggle("show", list.length === 0);
  const dirty = state.q || state.objs.size || state.fams.size || state.savedOnly;
  $("#btnClear").classList.toggle("show", !!dirty);
  $("#savedCount").textContent = `(${state.saved.size})`;
  $("#ownCount").textContent = `(${DATA.filter(h=>h.p===1).length})`;
  $("#goldCount").textContent = `(${DATA.filter(h=>h.p===2).length})`;
  // contadores por objetivo (dentro do recorte de busca+família, ignorando objetivo)
  const base = DATA.filter(h =>
    (!state.savedOnly || state.saved.has(h.n)) &&
    ((!state.ownOnly && !state.goldOnly) || (state.ownOnly && h.p===1) || (state.goldOnly && h.p===2)) &&
    (state.fams.size === 0 || h.f.some(f => state.fams.has(f))) &&
    (state.q === "" || h._idx.includes(state.q)));
  ["scroll","clique","lead","venda"].forEach(o => {
    document.querySelector(`[data-n="${o}"]`).textContent = base.filter(h => h.o === o).length;
  });
}

/* ---------- interações ---------- */
$("#q").addEventListener("input", e => { state.q = norm(e.target.value.trim()); render(); });
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
});

document.querySelectorAll("[data-obj]").forEach(c => c.addEventListener("click", () => {
  const o = c.dataset.obj;
  state.objs.has(o) ? state.objs.delete(o) : state.objs.add(o);
  c.toggleAttribute("data-on"); render();
}));
document.querySelectorAll("[data-fam]").forEach(c => c.addEventListener("click", () => {
  const f = c.dataset.fam;
  state.fams.has(f) ? state.fams.delete(f) : state.fams.add(f);
  c.toggleAttribute("data-on"); render();
}));

function clearAll(){
  state.q=""; state.objs.clear(); state.fams.clear(); state.savedOnly=false; state.ownOnly=false; state.goldOnly=false;
  $("#q").value="";
  document.querySelectorAll(".chip[data-on]").forEach(c => c.removeAttribute("data-on"));
  $("#btnSaved").removeAttribute("data-on");
  $("#btnOwn").removeAttribute("data-on");
  $("#btnGold").removeAttribute("data-on");
  render();
}
$("#btnClear").addEventListener("click", clearAll);
$("#btnClear2").addEventListener("click", clearAll);

$("#btnGold").addEventListener("click", () => {
  state.goldOnly = !state.goldOnly;
  if(state.goldOnly){ state.ownOnly = false; $("#btnOwn").removeAttribute("data-on"); }
  $("#btnGold").toggleAttribute("data-on", state.goldOnly);
  render();
});

$("#btnOwn").addEventListener("click", () => {
  state.ownOnly = !state.ownOnly;
  if(state.ownOnly){ state.goldOnly = false; $("#btnGold").removeAttribute("data-on"); }
  $("#btnOwn").toggleAttribute("data-on", state.ownOnly);
  render();
});

$("#btnSaved").addEventListener("click", () => {
  state.savedOnly = !state.savedOnly;
  $("#btnSaved").toggleAttribute("data-on", state.savedOnly);
  render();
});

$("#btnRandom").addEventListener("click", () => {
  const list = filtered();
  if(!list.length) return;
  const h = list[Math.floor(Math.random()*list.length)];
  const el = document.getElementById("h"+h.n);
  if(el){
    document.querySelectorAll(".card.hit").forEach(c => c.classList.remove("hit"));
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("hit");
    setTimeout(()=>el.classList.remove("hit"), 3500);
  }
});

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove("show"), 1600);
}

function copyText(t, btn){
  const done = () => {
    showToast("Copiado ✓");
    btn.classList.add("copied");
    setTimeout(()=>btn.classList.remove("copied"), 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ showToast("Não foi possível copiar"); }
    ta.remove();
  }
}

grid.addEventListener("click", e => {
  const card = e.target.closest(".card"); if(!card) return;
  const n = +card.dataset.n;
  const h = DATA.find(x => x.n === n);
  if(e.target.closest(".act-copy")){ copyText(h.t, e.target.closest(".act-copy")); return; }
  if(e.target.closest(".act-save")){
    const btn = e.target.closest(".act-save");
    state.saved.has(n) ? state.saved.delete(n) : state.saved.add(n);
    btn.classList.toggle("saved", state.saved.has(n));
    try{ localStorage.setItem("hooklab_saved", JSON.stringify([...state.saved])); }catch(e){}
    $("#savedCount").textContent = `(${state.saved.size})`;
    if(state.savedOnly) render();
  }
});

render();
